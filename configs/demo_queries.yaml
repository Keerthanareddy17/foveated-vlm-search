# (image, query) pairs for `make demo-batch` (ONLY=<substring> to run one photo). Images are cleaned copies from
# `make intake` (test_pictures/clean/). Order here = order in the replay page's selector.
# Queries: any COCO category name, or "food" (COCO's 10 food classes).
# expect: present | absent (scored per the README definitions: "found" = final point inside a gt box; absent = reports not found).
# gt_boxes: [x0, y0, x1, y1] in clean-image pixels, hand-measured on test_pictures/clean/*.jpg (Step 9).
#   apple: the only COCO-food object in the positive photos. The red sweet boxes in a basket at the right edge (all
#   three photos) are packaged food, not one of COCO's 10 food classes, so "food" on negative.jpg is expected absent.
# Plain names for the photos (used in the README, the replay page and the GIF; file names stay in source references).
photo_names:
  positive2.jpg: "desk, apple near the camera"
  positive.jpg: "desk, apple far away"
  negative.jpg: "desk, no apple"

runs:
  - {image: test_pictures/clean/positive2.jpg, query: food,  expect: present, gt_boxes: [[1604, 1212, 1832, 1428]]}
  - {image: test_pictures/clean/positive2.jpg, query: apple, expect: present, gt_boxes: [[1604, 1212, 1832, 1428]]}
  - {image: test_pictures/clean/positive2.jpg, query: mouse, expect: present, gt_boxes: [[474, 984, 718, 1093]]}
  - {image: test_pictures/clean/positive.jpg,  query: food,  expect: present, gt_boxes: [[1460, 369, 1538, 449]]}
  - {image: test_pictures/clean/positive.jpg,  query: apple, expect: present, gt_boxes: [[1460, 369, 1538, 449]]}
  - {image: test_pictures/clean/positive.jpg,  query: mouse, expect: present, gt_boxes: [[893, 895, 1104, 993]]}
  - {image: test_pictures/clean/negative.jpg,  query: food,  expect: absent}
  - {image: test_pictures/clean/negative.jpg,  query: apple, expect: absent}

# Explanatory notes for WRONG answers whose final point lands in a region (hand-measured boxes). Scoring is unchanged:
# the answer stays WRONG; the note says what the model pointed at. Applied by run_demo, replay and the sweep.
notes:
  test_pictures/clean/positive2.jpg:
    - {box: [1640, 845, 1900, 1045], queries: [food, apple], note: "packaged sweets: food to a person, not a COCO food class"}
  test_pictures/clean/positive.jpg:
    - {box: [1735, 735, 1920, 960], queries: [food, apple], note: "packaged sweets: food to a person, not a COCO food class"}
  test_pictures/clean/negative.jpg:
    - {box: [1760, 790, 1920, 1000], queries: [food, apple], note: "packaged sweets: food to a person, not a COCO food class"}
    - {box: [808, 880, 1042, 990], queries: [apple], note: "pointed at the Apple-logo mouse"}
