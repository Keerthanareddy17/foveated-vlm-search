# Named eval runs (Step 5). `make eval RUN=<name>` runs one; `make baselines` runs the R1-R4 set.
# split: dev (50) | test (450 = all minus dev) | all (500) | latency (100 seeded from test, concurrency 1)
# set:   dotted config overrides applied on top of configs/{base,search,prompts,eval}.yaml
# overlays: extra config files (e.g. configs/serve_finetuned.yaml); the server must be serving that model
# Accuracy runs use split "all"; test numbers are the same traces with dev queries filtered out.
runs:
  # ---- Part A: choices made on dev only
  dev_sw_point:        {strategy: sliding_window, split: dev, set: {search.sliding_window.tile_mode: point}}
  dev_sw_confirm:      {strategy: sliding_window, split: dev, set: {search.sliding_window.tile_mode: confirm}}
  dev_eye_plain:       {strategy: eye_search, split: dev, set: {search.retry_prompt: plain}}
  dev_eye_encourage:   {strategy: eye_search, split: dev, set: {search.retry_prompt: encourage}}
  dev_eye_refine_on:   {strategy: eye_search, split: dev, set: {search.confirm.refine_point: true}}
  dev_eye_refine_off:  {strategy: eye_search, split: dev, set: {search.confirm.refine_point: false}}

  # ---- R1-R4 accuracy (concurrency from harness.concurrency)
  R1_full_frame:       {strategy: full_frame, split: all}
  R2_sliding_window:   {strategy: sliding_window, split: all}
  R3_downscale:        {strategy: downscale, split: all}
  R4_eye_search:       {strategy: eye_search, split: all}
  # ---- R1-R4 latency (concurrency 1, 100-query subset of test)
  R1_full_frame_lat:     {strategy: full_frame, split: latency}
  R2_sliding_window_lat: {strategy: sliding_window, split: latency}
  R3_downscale_lat:      {strategy: downscale, split: latency}
  R4_eye_search_lat:     {strategy: eye_search, split: latency}

  # ---- eye-search sweeps (test split, base model)
  sweep_thumb64:   {strategy: eye_search, split: test, set: {search.thumbnail_long_side: 64}}
  # (thumbnail 96 / crop 224 = R4_eye_search, filtered to test)
  sweep_thumb128:  {strategy: eye_search, split: test, set: {search.thumbnail_long_side: 128}}
  sweep_thumb192:  {strategy: eye_search, split: test, set: {search.thumbnail_long_side: 192}}
  sweep_crop160:   {strategy: eye_search, split: test, set: {search.fixation_size: 160}}
  sweep_crop288:   {strategy: eye_search, split: test, set: {search.fixation_size: 288}}
  # ---- refined point on vs off (test)
  R4_refine_off:   {strategy: eye_search, split: all, set: {search.confirm.refine_point: false}}

  # ---- Step 7 sanity checks with the merged fine-tuned model (dev only; R5 on test is Step 8)
  dev_eye_finetuned:        {strategy: eye_search, split: dev, overlays: [configs/serve_finetuned.yaml]}
  dev_full_frame_finetuned: {strategy: full_frame, split: dev, overlays: [configs/serve_finetuned.yaml]}

  # ---- Step 8: fine-tuned model (BF16), same harness and frozen settings
  R5_eye_search:       {strategy: eye_search, split: all, overlays: [configs/serve_finetuned.yaml]}
  R5_eye_search_lat:   {strategy: eye_search, split: latency, overlays: [configs/serve_finetuned.yaml]}
  # reference rows (not part of R1-R7): fine-tuned model with the single-call strategies
  R1ft_full_frame:     {strategy: full_frame, split: all, overlays: [configs/serve_finetuned.yaml]}
  R1ft_full_frame_lat: {strategy: full_frame, split: latency, overlays: [configs/serve_finetuned.yaml]}
  # R3ft budget = R5's measured mean pixels per query on test: 50025.6 -> 50026 (results/runs/R5_eye_search.jsonl, test ids)
  R3ft_downscale:      {strategy: downscale, split: all, overlays: [configs/serve_finetuned.yaml], set: {search.downscale.pixel_budget: 50026}}
  R3ft_downscale_lat:  {strategy: downscale, split: latency, overlays: [configs/serve_finetuned.yaml], set: {search.downscale.pixel_budget: 50026}}
  # fine-tuned thumbnail sweep (test; 96 px = R5)
  sweep_ft_thumb64:    {strategy: eye_search, split: test, overlays: [configs/serve_finetuned.yaml], set: {search.thumbnail_long_side: 64}}
  sweep_ft_thumb128:   {strategy: eye_search, split: test, overlays: [configs/serve_finetuned.yaml], set: {search.thumbnail_long_side: 128}}
  sweep_ft_thumb192:   {strategy: eye_search, split: test, overlays: [configs/serve_finetuned.yaml], set: {search.thumbnail_long_side: 192}}
  # FP8 (R6) and FP8 + prefix caching (R7)
  R6_eye_search:       {strategy: eye_search, split: all, overlays: [configs/serve_finetuned_fp8.yaml]}
  R6_eye_search_lat:   {strategy: eye_search, split: latency, overlays: [configs/serve_finetuned_fp8.yaml]}
  R7_eye_search:       {strategy: eye_search, split: test, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_finetuned_fp8_prefix.yaml]}
  R7_eye_search_lat:   {strategy: eye_search, split: latency, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_finetuned_fp8_prefix.yaml]}

  # ---- Step 8b: frame-size scaling (fine-tuned FP8, prefix caching off, hi-res server). 1x1 = test queries that
  # fit a 640x480 cell; 2x2 / 3x3 = the same queries as mosaics. Downscale budget = eye-96 mean pixels at that size.
  sc1_full:    {strategy: full_frame, split: test_fit, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml]}
  sc1_full_lat: {strategy: full_frame, split: latency_fit, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml]}
  sc1_eye96:   {strategy: eye_search, split: test_fit, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 96}}
  sc1_eye96_lat: {strategy: eye_search, split: latency_fit, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 96}}
  sc1_eye192:  {strategy: eye_search, split: test_fit, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 192}}
  sc1_eye192_lat: {strategy: eye_search, split: latency_fit, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 192}}
  sc1_eye288:  {strategy: eye_search, split: test_fit, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 288}}
  sc1_eye288_lat: {strategy: eye_search, split: latency_fit, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 288}}
  sc1_down:    {strategy: downscale, split: test_fit, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.downscale.pixel_budget: 49261}}
  sc1_down_lat: {strategy: downscale, split: latency_fit, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.downscale.pixel_budget: 49261}}
  sc2_full:    {strategy: full_frame, split: test_m2, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml]}
  sc2_full_lat: {strategy: full_frame, split: latency_m2, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml]}
  sc2_eye96:   {strategy: eye_search, split: test_m2, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 96}}
  sc2_eye96_lat: {strategy: eye_search, split: latency_m2, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 96}}
  sc2_eye192:  {strategy: eye_search, split: test_m2, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 192}}
  sc2_eye192_lat: {strategy: eye_search, split: latency_m2, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 192}}
  sc2_eye288:  {strategy: eye_search, split: test_m2, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 288}}
  sc2_eye288_lat: {strategy: eye_search, split: latency_m2, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 288}}
  sc2_down:    {strategy: downscale, split: test_m2, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.downscale.pixel_budget: 62002}}
  sc2_down_lat: {strategy: downscale, split: latency_m2, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.downscale.pixel_budget: 62002}}
  sc3_full:    {strategy: full_frame, split: test_m3, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml]}
  sc3_full_lat: {strategy: full_frame, split: latency_m3, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml]}
  sc3_eye96:   {strategy: eye_search, split: test_m3, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 96}}
  sc3_eye96_lat: {strategy: eye_search, split: latency_m3, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 96}}
  sc3_eye192:  {strategy: eye_search, split: test_m3, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 192}}
  sc3_eye192_lat: {strategy: eye_search, split: latency_m3, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 192}}
  sc3_eye288:  {strategy: eye_search, split: test_m3, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 288}}
  sc3_eye288_lat: {strategy: eye_search, split: latency_m3, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.thumbnail_long_side: 288}}
  sc3_down:    {strategy: downscale, split: test_m3, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.downscale.pixel_budget: 79702}}
  sc3_down_lat: {strategy: downscale, split: latency_m3, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.downscale.pixel_budget: 79702}}
  # look-again fix test: gray out checked crops in the thumbnail (1x1 test split; compare with R6)
  mask_eye96:    {strategy: eye_search, split: test, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml], set: {search.look_again_mask: true}}
  nomask_eye96:  {strategy: eye_search, split: test, overlays: [configs/serve_finetuned_fp8.yaml, configs/serve_hires.yaml]}

# R-row -> run names for results/table.md. R5-R7 are filled in Step 8.
table:
  R1: {label: "base 2B, BF16, full frame", acc: R1_full_frame, lat: R1_full_frame_lat}
  R2: {label: "base 2B, BF16, sliding window", acc: R2_sliding_window, lat: R2_sliding_window_lat}
  R3: {label: "base 2B, BF16, uniform downscale", acc: R3_downscale, lat: R3_downscale_lat}
  R4: {label: "base 2B, BF16, eye search", acc: R4_eye_search, lat: R4_eye_search_lat}
  R5: {label: "fine-tuned 2B, BF16, eye search", acc: R5_eye_search, lat: R5_eye_search_lat}
  R6: {label: "fine-tuned 2B, FP8, eye search", acc: R6_eye_search, lat: R6_eye_search_lat}
  R7: {label: "fine-tuned 2B, FP8 + prefix caching, eye search", acc: R7_eye_search, lat: R7_eye_search_lat}

# Reference rows (shown in a separate block, not part of R1-R7)
reference:
  R1-ft: {label: "fine-tuned 2B, BF16, full frame", acc: R1ft_full_frame, lat: R1ft_full_frame_lat}
  R3-ft: {label: "fine-tuned 2B, BF16, downscale (budget = R5 mean)", acc: R3ft_downscale, lat: R3ft_downscale_lat}
  R4-192: {label: "base 2B, BF16, eye search, 192 px thumbnail (Step 5 sweep)", acc: sweep_thumb192}

# Paired comparisons on the same test queries (b minus a)
paired:
  - [R4_eye_search, R5_eye_search, "fine-tuning (eye search)"]
  - [R1ft_full_frame, R5_eye_search, "eye search vs full frame, both fine-tuned"]
  - [R5_eye_search, R6_eye_search, "FP8 vs BF16 (fine-tuned eye search)"]
  - [R6_eye_search, R7_eye_search, "prefix caching on vs off (FP8)"]
  - [nomask_eye96, mask_eye96, "look-again mask on vs off (FP8, same server, Step 8b)"]
  - [R6_eye_search, mask_eye96, "look-again mask vs R6"]

second_fixation: [R4_eye_search, R5_eye_search, R6_eye_search, R7_eye_search, nomask_eye96, mask_eye96]

baselines: [R1_full_frame, R2_sliding_window, R3_downscale, R4_eye_search,
            R1_full_frame_lat, R2_sliding_window_lat, R3_downscale_lat, R4_eye_search_lat]

# Step 8b scaling: frame size -> {strategy label: accuracy run, latency run}
scaling:
  sizes: {"1x1 (640x480)": 1, "2x2 (1280x960)": 2, "3x3 (1920x1440)": 3}
  strategies: {"full frame": full, "downscale (eye-96 budget)": down, "eye search 96 px": eye96, "eye search 192 px": eye192, "eye search 288 px": eye288}
