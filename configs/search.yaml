# Search strategy parameters (Step 4). Frame-relative sizes are in source pixels.
search:
  thumbnail_long_side: 96      # snapped to a multiple of 32; short side chosen to best keep aspect
  fixation_size: 224           # square sharp crop from the original frame (clamped to the frame)
  max_fixations: 3             # max thumbnail point calls in eye search (repeats count)
  max_tokens_point: 24         # caps for runaway generations; real answers are much shorter
  max_tokens_confirm: 40

  retry_prompt: plain         # fixations 2+: plain (point + point_checked_suffix) | encourage (point_retry_encourage)

  confirm:
    refine_point: true         # ask for a refined point inside the crop on "yes"
    label: false               # short evidence label on "yes": demo only, off for all evals (Step 5)
    label_max_chars: 48        # schema cap; labels hitting the cap are cut back to a word boundary

  downscale:
    # Pixel budget for the single downscaled frame (sides multiples of 32, aspect kept).
    # null = nominal eye-search cost of one thumbnail + one fixation for this frame.
    # Set in Step 5 to R4's (eye search, base BF16) measured mean pixels sampled per query on the
    # test split: 52965.8 -> 52966 px (results/runs/R4_eye_search.jsonl, test ids only).
    pixel_budget: 52966

  sliding_window:
    tile_size: null            # null = fixation_size
    overlap: 0.25              # fraction of tile size shared by neighbouring tiles
    order: raster              # raster (row by row, top-left first) | center_out
    parallel: false            # true = send all tiles at once (wall-clock), decision still raster-first
    # confirm: yes/no per tile (same call as eye search's confirm, point+label off); point call only on a
    #          "yes" tile, to localize. point: Step 4 behaviour (point call per tile, stop at first point);
    #          the base model points at something on every tile, so it stops at tile 1 (Step 4/5).
    tile_mode: confirm
